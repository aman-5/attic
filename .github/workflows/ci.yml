name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          # Pinned to macos-14 (Apple Silicon/arm64) rather than macos-latest so
          # this stays real native-arm64 compile+test evidence regardless of
          # future macos-latest default changes. There is no GPU/Metal on this
          # hosted runner and no Metal backend implemented in this codebase, so
          # this is CPU-only compile+test evidence, not GPU runtime evidence.
          - os: macos-14

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit + integration tests
        run: cargo test --workspace

  windows-directml-compile-only:
    # No GPU is present on GitHub-hosted windows-latest runners, so this job
    # only proves the ort-directml feature compiles cleanly on Windows MSVC.
    # It is NOT a GPU/DirectML runtime test.
    name: windows-directml-compile-only
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.98.0

      - uses: Swatinem/rust-cache@v2

      - name: Build with ort-directml feature (compile-only, no GPU on hosted runner)
        run: cargo build --workspace --features attic-server/ort-directml

  package:
    name: packaging layout verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Verify archive layout rules
        shell: bash
        run: |
          mkdir -p /tmp/fake-archive/docs
          touch /tmp/fake-archive/attic-server
          touch /tmp/fake-archive/README.md
          touch /tmp/fake-archive/LICENSE-MIT
          touch /tmp/fake-archive/LICENSE-APACHE
          touch /tmp/fake-archive/docs/x.md

          bash tools/package.sh --verify /tmp/fake-archive

          touch /tmp/fake-archive/build_errors.txt

          if bash tools/package.sh --verify /tmp/fake-archive; then
            echo "verifier accepted a dirty archive"
            exit 1
          fi
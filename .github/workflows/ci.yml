name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit + integration tests
        run: cargo test --workspace

  package:
    name: packaging layout verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify archive layout rules
        shell: bash
        run: |
          mkdir -p /tmp/fake-archive/docs
          touch /tmp/fake-archive/attic-server
          touch /tmp/fake-archive/README.md
          touch /tmp/fake-archive/docs/x.md

          bash tools/package.sh --verify /tmp/fake-archive

          touch /tmp/fake-archive/build_errors.txt

          if bash tools/package.sh --verify /tmp/fake-archive; then
            echo "verifier accepted a dirty archive"
            exit 1
          fi
name: Release

# Release model:
#
#   Successful CI on main
#           ↓
#   Prepare next v0.1.x version
#           ↓
#   Required builds:
#     - Windows x64
#     - Linux x64
#     - macOS Apple Silicon
#           ↓
#   ALL required builds pass
#           ↓
#   Create tag + GitHub Release
#           ↓
#   macOS Intel continues independently
#           ↓
#   If Intel succeeds later, attach its binary to the SAME release.
#
# Example:
#
#   first successful release -> v0.1.0
#   next successful release  -> v0.1.1
#   next                     -> v0.1.2

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

# Prevent two main pushes from racing to create the same v0.1.x version.
concurrency:
  group: attic-release
  cancel-in-progress: false


jobs:

  # ===========================================================================
  # PREPARE
  # ===========================================================================

  prepare:
    name: prepare release
    runs-on: ubuntu-latest

    # Automatic release:
    #   CI must have succeeded and must have run for main.
    #
    # Manual workflow_dispatch is also supported.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )

    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.source.outputs.sha }}
      already_released: ${{ steps.version.outputs.already_released }}

    steps:

      # -----------------------------------------------------------------------
      # Resolve exact commit that passed CI
      # -----------------------------------------------------------------------

      - name: Resolve source commit
        id: source
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SHA="${{ github.sha }}"
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "source SHA: $SHA"


      # -----------------------------------------------------------------------
      # Checkout with complete history/tags
      # -----------------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0


      - name: Fetch tags
        shell: bash
        run: |
          git fetch --force --tags


      # -----------------------------------------------------------------------
      # Calculate next v0.1.x
      # -----------------------------------------------------------------------

      - name: Determine next v0.1.x version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          SHA="${{ steps.source.outputs.sha }}"

          # -------------------------------------------------------------------
          # Idempotency:
          #
          # If this exact commit already has a v0.1.x tag, do not create
          # another version when this workflow is rerun.
          # -------------------------------------------------------------------

          EXISTING="$(
            git tag --points-at "$SHA" \
              | grep -E '^v0\.1\.[0-9]+$' \
              | head -n 1 || true
          )"

          if [[ -n "$EXISTING" ]]; then
            echo "Commit already released as $EXISTING"

            echo "version=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "already_released=true" >> "$GITHUB_OUTPUT"

            exit 0
          fi


          # -------------------------------------------------------------------
          # Determine highest existing numeric patch.
          #
          # Numeric sorting is important:
          #
          #   v0.1.9
          #   v0.1.10
          #
          # must produce v0.1.11.
          # -------------------------------------------------------------------

          LATEST_PATCH="$(
            git tag -l 'v0.1.*' \
              | sed -nE 's/^v0\.1\.([0-9]+)$/\1/p' \
              | sort -n \
              | tail -n 1
          )"

          if [[ -z "$LATEST_PATCH" ]]; then
            NEXT_PATCH=0
          else
            NEXT_PATCH=$((LATEST_PATCH + 1))
          fi

          VERSION="v0.1.${NEXT_PATCH}"

          echo "Next release: $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "already_released=false" >> "$GITHUB_OUTPUT"


  # ===========================================================================
  # REQUIRED RELEASE BUILDS
  #
  # These THREE platforms must succeed before a release is published.
  # ===========================================================================

  build:
    name: build ${{ matrix.target }}

    needs:
      - prepare

    if: needs.prepare.outputs.already_released != 'true'

    strategy:
      fail-fast: false

      matrix:
        include:

          # -------------------------------------------------------------------
          # Windows x64
          # -------------------------------------------------------------------

          - target: x86_64-pc-windows-msvc
            os: windows-latest


          # -------------------------------------------------------------------
          # Linux x64
          # -------------------------------------------------------------------

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest


          # -------------------------------------------------------------------
          # macOS Apple Silicon
          #
          # aarch64 = M1 / M2 / M3 / M4 / future ARM64 Apple Silicon
          # -------------------------------------------------------------------

          - target: aarch64-apple-darwin
            os: macos-latest


    runs-on: ${{ matrix.os }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}


      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}


      - name: Rust cache
        uses: Swatinem/rust-cache@v2


      # -----------------------------------------------------------------------
      # Tests
      # -----------------------------------------------------------------------

      - name: Run tests
        run: |
          cargo test --workspace


      # -----------------------------------------------------------------------
      # Package
      # -----------------------------------------------------------------------

      - name: Stage Windows release
        if: runner.os == 'Windows'
        shell: bash
        env:
          ATTIC_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          export ATTIC_RELEASE_VERSION="${ATTIC_RELEASE_VERSION#v}"

          bash tools/package.sh \
            --target "${{ matrix.target }}" \
            --out dist \
            --stage-only

      - name: Create and verify Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"

          $Target = "${{ matrix.target }}"
          $Name = "attic-$env:RELEASE_TAG-$Target"
          $Stage = Join-Path $PWD "dist\$Name"
          $Archive = Join-Path $PWD "dist\$Name.zip"
          $Checksum = "$Archive.sha256"
          $VerifyDir = Join-Path $env:RUNNER_TEMP "attic-release-verify-$Target"

          if (-not (Test-Path -LiteralPath $Stage -PathType Container)) {
              throw "Staged release directory is missing: $Stage"
          }

          Remove-Item -LiteralPath $Archive -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $Checksum -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $VerifyDir -Recurse -Force -ErrorAction SilentlyContinue

          Compress-Archive `
              -LiteralPath $Stage `
              -DestinationPath $Archive `
              -Force

          if (-not (Test-Path -LiteralPath $Archive -PathType Leaf)) {
              throw "Windows release ZIP was not created: $Archive"
          }

          New-Item -ItemType Directory -Path $VerifyDir -Force | Out-Null
          Expand-Archive `
              -LiteralPath $Archive `
              -DestinationPath $VerifyDir `
              -Force

          $ExpectedBinary = Join-Path $VerifyDir "$Name\attic-server.exe"
          if (-not (Test-Path -LiteralPath $ExpectedBinary -PathType Leaf)) {
              throw "Windows ZIP does not contain expected binary: $ExpectedBinary"
          }

          $Hash = (Get-FileHash -LiteralPath $Archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $ArchiveFileName = Split-Path -Leaf $Archive
          "$Hash  $ArchiveFileName" | Set-Content -LiteralPath $Checksum -Encoding ascii

          if (-not (Test-Path -LiteralPath $Checksum -PathType Leaf)) {
              throw "Windows checksum was not created: $Checksum"
          }

          Write-Host "OK: $Archive"
          Write-Host "OK: $Checksum"
          Write-Host "OK: extracted binary verified at $ExpectedBinary"

      - name: Package Unix release
        if: runner.os != 'Windows'
        shell: bash
        env:
          ATTIC_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          export ATTIC_RELEASE_VERSION="${ATTIC_RELEASE_VERSION#v}"

          bash tools/package.sh \
            --target "${{ matrix.target }}" \
            --out dist

      - name: Verify packaged artifact contract
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          NAME="attic-${RELEASE_TAG}-${{ matrix.target }}"

          case "${{ matrix.target }}" in
            *windows*) ARCHIVE="dist/${NAME}.zip" ;;
            *)         ARCHIVE="dist/${NAME}.tar.gz" ;;
          esac

          test -f "$ARCHIVE"
          test -f "${ARCHIVE}.sha256"

          echo "verified release artifact: $ARCHIVE"
          echo "verified checksum: ${ARCHIVE}.sha256"


      - name: Show packaged files
        shell: bash
        run: |
          find dist -maxdepth 2 -type f -print


      # -----------------------------------------------------------------------
      # Store artifact inside this workflow run
      # -----------------------------------------------------------------------

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: attic-${{ matrix.target }}

          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.tar.gz
            dist/*.tar.gz.sha256

          if-no-files-found: error


  # ===========================================================================
  # OPTIONAL INTEL macOS BUILD
  #
  # IMPORTANT:
  #
  # publish DOES NOT depend on this job.
  #
  # Therefore if GitHub has no Intel Mac runner available, this job can remain
  # queued without blocking Windows/Linux/Apple-Silicon release publication.
  # ===========================================================================

  build-intel-macos:
    name: build x86_64-apple-darwin

    needs:
      - prepare

    if: needs.prepare.outputs.already_released != 'true'

    runs-on: macos-13

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}


      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin


      - name: Rust cache
        uses: Swatinem/rust-cache@v2


      # -----------------------------------------------------------------------
      # Tests
      # -----------------------------------------------------------------------

      - name: Run tests
        run: |
          cargo test --workspace


      # -----------------------------------------------------------------------
      # Package
      # -----------------------------------------------------------------------

      - name: Package release
        shell: bash
        env:
          ATTIC_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          export ATTIC_RELEASE_VERSION="${ATTIC_RELEASE_VERSION#v}"

          bash tools/package.sh \
            --target "x86_64-apple-darwin" \
            --out dist


      - name: Verify packaged artifact contract
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          ARCHIVE="dist/attic-${RELEASE_TAG}-x86_64-apple-darwin.tar.gz"
          test -f "$ARCHIVE"
          test -f "${ARCHIVE}.sha256"
          echo "verified release artifact: $ARCHIVE"
          echo "verified checksum: ${ARCHIVE}.sha256"


      - name: Show packaged files
        shell: bash
        run: |
          find dist -maxdepth 2 -type f -print


      # -----------------------------------------------------------------------
      # Store Intel artifact
      # -----------------------------------------------------------------------

      - name: Upload Intel macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: attic-x86_64-apple-darwin

          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

          if-no-files-found: error


  # ===========================================================================
  # PUBLISH REQUIRED RELEASE
  #
  # This depends ONLY on:
  #
  #   prepare
  #   required 3-platform build matrix
  #
  # It deliberately DOES NOT depend on build-intel-macos.
  # ===========================================================================

  publish:
    name: publish ${{ needs.prepare.outputs.version }}

    needs:
      - prepare
      - build

    if: needs.prepare.outputs.already_released != 'true'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0


      # -----------------------------------------------------------------------
      # Download ONLY the required platform artifacts.
      #
      # We intentionally do not wildcard-download Intel here because whether
      # Intel happened to finish early must not affect initial release contents.
      # -----------------------------------------------------------------------

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: attic-x86_64-pc-windows-msvc
          path: dist


      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: attic-x86_64-unknown-linux-gnu
          path: dist


      - name: Download Apple Silicon artifact
        uses: actions/download-artifact@v4
        with:
          name: attic-aarch64-apple-darwin
          path: dist


      - name: Show release files
        shell: bash
        run: |
          find dist -maxdepth 1 -type f -print


      # -----------------------------------------------------------------------
      # Create tag ONLY after required binaries have successfully built,
      # packaged and been downloaded.
      # -----------------------------------------------------------------------

      - name: Create release tag
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch --force --tags

          # -------------------------------------------------------------------
          # Protect against unexpected reruns/concurrency.
          # -------------------------------------------------------------------

          if git rev-parse "$VERSION" >/dev/null 2>&1; then

            EXISTING_SHA="$(git rev-list -n 1 "$VERSION")"

            if [[ "$EXISTING_SHA" != "$SHA" ]]; then
              echo "ERROR: $VERSION already exists on another commit"
              exit 1
            fi

            echo "$VERSION already exists on this commit"

          else

            git tag "$VERSION" "$SHA"
            git push origin "$VERSION"

          fi


      # -----------------------------------------------------------------------
      # Publish initial GitHub Release.
      #
      # Contains:
      #
      #   Windows x64
      #   Linux x64
      #   macOS Apple Silicon
      #
      # Intel Mac may be attached later.
      # -----------------------------------------------------------------------

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.sha }}

          files: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.tar.gz
            dist/*.tar.gz.sha256

          draft: false
          prerelease: false
          generate_release_notes: true


  # ===========================================================================
  # ATTACH INTEL MACOS LATER
  #
  # This runs only when BOTH:
  #
  #   initial release has been published
  #   Intel macOS build succeeded
  #
  # If Intel waits three hours for a runner, this job simply waits for Intel.
  #
  # It does NOT create another version.
  #
  # Example:
  #
  #   v0.1.0 initially:
  #
  #       Windows
  #       Linux
  #       Apple Silicon
  #
  #   later:
  #
  #       Intel finishes
  #             ↓
  #       Intel artifact attached to SAME v0.1.0
  # ===========================================================================

  attach-intel-macos:
    name: attach Intel macOS binary

    needs:
      - prepare
      - publish
      - build-intel-macos

    if: >
      always() &&
      needs.prepare.result == 'success' &&
      needs.publish.result == 'success' &&
      needs.build-intel-macos.result == 'success' &&
      needs.prepare.outputs.already_released != 'true'

    runs-on: ubuntu-latest

    steps:

      - name: Download Intel macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: attic-x86_64-apple-darwin
          path: dist


      - name: Show Intel release files
        shell: bash
        run: |
          find dist -maxdepth 1 -type f -print


      # -----------------------------------------------------------------------
      # softprops/action-gh-release updates the EXISTING release associated
      # with this tag and uploads the additional files.
      # -----------------------------------------------------------------------

      - name: Attach Intel macOS files to existing release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}

          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
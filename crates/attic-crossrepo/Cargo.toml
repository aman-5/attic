[package]
name         = "attic-crossrepo"
description  = "Attic - Phase 6 bounded cross-repository intelligence: dependency metadata parsing, workspace catalog, resolver, budgeted graph traversal and impact analysis"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true

[dependencies]
attic-core.workspace      = true
attic-discovery.workspace = true
attic-evidence.workspace  = true
attic-storage.workspace   = true
blake3.workspace          = true
rusqlite.workspace        = true
serde.workspace           = true
serde_json.workspace      = true
uuid.workspace            = true
tracing.workspace         = true
thiserror.workspace       = true

[dev-dependencies]
attic-indexing.workspace = true
attic-retrieval.workspace = true
tempfile.workspace        = true
criterion                 = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "crossrepo_bench"
harness = false

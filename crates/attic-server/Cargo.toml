[package]
name         = "attic-server"
description  = "Attic MCP server binary (Phase 1D)"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true

[[bin]]
name = "attic"
path = "src/main.rs"

[dependencies]
attic-core.workspace      = true
attic-storage.workspace   = true
attic-indexing.workspace  = true
attic-discovery.workspace = true
attic-incremental.workspace = true
attic-retrieval = { path = '../attic-retrieval' }
attic-crossrepo = { path = '../attic-crossrepo' }
attic-semantic  = { path = '../attic-semantic' }
attic-inference-worker = { path = '../attic-inference-worker' }
rmcp  = { workspace = true, features = ["client"] }
tokio = { workspace = true, features = ["process", "io-util", "net"] }
serde.workspace           = true
serde_json.workspace      = true
tracing.workspace         = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
thiserror.workspace       = true
anyhow.workspace          = true
interprocess = { workspace = true }

[dev-dependencies]
tempfile.workspace = true


[features]
# GPU semantic backends.
#   ort-directml : no-op alias. DirectML (any DX12 GPU) is built in
#                  automatically on Windows MSVC; nothing to enable.
#   candle-cuda  : NVIDIA on Linux and Windows (requires the CUDA toolkit).
#   candle-metal : Apple Silicon macOS.
# Build e.g.: cargo build -p attic-server --features candle-metal
default = []
ort-directml = ["attic-semantic/ort-directml"]
candle-cuda = ["attic-semantic/candle-cuda"]
candle-metal = ["attic-semantic/candle-metal"]

[package]
name = "attic-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Attic MCP server binary"
license.workspace = true

[[bin]]
name = "attic"
path = "src/main.rs"

[dependencies]
attic-core = { path = "../attic-core" }
attic-indexing = { path = "../attic-indexing" }
attic-retrieval = { path = "../attic-retrieval" }
attic-evidence = { path = "../attic-evidence" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true

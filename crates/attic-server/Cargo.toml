[package]
name         = "attic-server"
description  = "Attic MCP server binary (Phase 1D)"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true

[[bin]]
name = "attic"
path = "src/main.rs"

[dependencies]
attic-core.workspace      = true
attic-storage.workspace   = true
attic-indexing.workspace  = true
attic-discovery.workspace = true
attic-incremental.workspace = true
attic-retrieval = { path = '../attic-retrieval' }
attic-crossrepo = { path = '../attic-crossrepo' }
attic-semantic  = { path = '../attic-semantic' }
attic-evidence = { path = '../attic-evidence' }
rmcp  = { workspace = true, features = ["client"] }
tokio = { workspace = true, features = ["process", "io-util"] }
serde.workspace           = true
serde_json.workspace      = true
tracing.workspace         = true
tracing-subscriber.workspace = true
thiserror.workspace       = true
anyhow.workspace          = true

[dev-dependencies]
tempfile.workspace = true
regex = "1"


[package]
name        = "attic-retrieval"
description = "Attic — query classification, RetrievalPlanner, retrievers, candidate fusion, context builder"
version.workspace     = true
edition.workspace     = true
rust-version.workspace = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true

[dependencies]
attic-core    = { workspace = true }

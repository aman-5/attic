[package]
name         = "attic-gpu-telemetry-win"
version      = "0.1.0"
edition.workspace    = true
rust-version.workspace = true
authors.workspace    = true
license.workspace    = true
description  = "Windows-only DXGI adapter-memory-budget FFI shim for Phase 5 VRAM telemetry (isolates the unsafe COM interop out of attic-storage, which forbids unsafe_code)."

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Foundation",
] }

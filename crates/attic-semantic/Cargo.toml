[package]
name = "attic-semantic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
attic-core = { path = "../attic-core" }
attic-storage = { path = "../attic-storage" }
attic-discovery = { workspace = true }
rusqlite = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
sha2 = "0.11"
hex = "0.4"
tracing = { workspace = true }
candle-core = { workspace = true }
candle-nn = { workspace = true }
candle-transformers = { workspace = true }
tokenizers = { workspace = true }
hf-hub = { workspace = true }
attic-inference-worker = { path = "../attic-inference-worker" }
rayon = "1.10"
hnsw_rs = "0.3.4"

# Phase 4: ORT/DirectML GPU provider (Windows-first; no CUDA toolkit needed).
# Optional so default builds stay lean and platform-specific backends compile
# only where they ship.
ort = { version = "2.0.0-rc.10", features = ["directml", "ndarray", "half"], optional = true }
half = { version = "2.1", features = ["num-traits"], optional = true }
ndarray = { version = "0.17", optional = true }

[features]
default = []
ort-directml = ["dep:ort", "dep:half", "dep:ndarray"]

# Candle GPU backends. These enable real `Device::new_cuda` /
# `Device::new_metal` support; without them Candle still compiles those calls
# but returns `NotCompiledWith*Support` at runtime, which `device.rs` turns
# into an actionable "rebuild with this feature" message rather than a silent
# CPU fallback.
#
# candle-cuda  : NVIDIA on Linux and Windows (requires the CUDA toolkit).
# candle-metal : Apple Silicon macOS (no extra SDK beyond Xcode tools).
#
# There is deliberately no AMD/ROCm feature: Candle has no ROCm backend, so
# offering one here would be a label with nothing behind it — exactly the
# problem the dead `OrtCoreMl`/`CandleCuda` enum variants used to create.
candle-cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
candle-metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

[dev-dependencies]
tempfile = { workspace = true }



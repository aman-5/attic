[package]
name         = "attic-storage"
version      = "0.1.0"
edition.workspace    = true
rust-version.workspace = true
authors.workspace    = true
license.workspace    = true
description  = "SQLite-backed persistence layer for the Attic MCP server (Phase 1A)."

[dependencies]
attic-core.workspace  = true
blake3          = { workspace = true }
rusqlite.workspace    = true
thiserror.workspace   = true
serde.workspace       = true
serde_json.workspace  = true
uuid.workspace        = true
tracing.workspace     = true

# Phase 7: cross-platform process RSS measurement (real memory enforcement)
sysinfo            = { workspace = true }

# Phase 5: VRAM telemetry (gpu_telemetry.rs). The actual DXGI FFI (which needs
# `unsafe`) lives in the separate attic-gpu-telemetry-win crate, since this
# crate sets `#![forbid(unsafe_code)]` crate-wide. Windows-only via
# target-cfg dependency; never pulled in on non-Windows builds.
[target.'cfg(windows)'.dependencies]
attic-gpu-telemetry-win = { path = "../attic-gpu-telemetry-win" }

[dev-dependencies]
tracing-subscriber.workspace = true
tempfile.workspace           = true


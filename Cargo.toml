[workspace]
resolver = "2"
members = [
    "crates/attic-core",
    "crates/attic-storage",
    "crates/attic-analyzers",
    "crates/attic-discovery",
    "crates/attic-evidence",
    "crates/attic-indexing",
    "crates/attic-retrieval",
    "crates/attic-server",
    "crates/attic-test-support",
]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.88"
authors      = ["Attic Contributors"]
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/aman-5/attic"

[workspace.dependencies]
rusqlite           = { version = "0.40.2",  default-features = false, features = ["bundled"] }
thiserror          = "2.0.20"
serde              = { version = "1.0.219", features = ["derive"] }
serde_json         = "1.0.140"
uuid               = { version = "1.11.0",  features = ["v4", "serde"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3",     features = ["env-filter"] }
attic-core         = { path = "crates/attic-core" }
attic-storage      = { path = "crates/attic-storage" }
attic-test-support = { path = "crates/attic-test-support" }
